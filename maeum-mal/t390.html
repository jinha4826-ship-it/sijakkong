<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마음말 390 테스트</title>
<style>
  body{margin:0;background:#d9d4dc;font-family:system-ui,sans-serif;display:flex;gap:22px;padding:18px;align-items:flex-start}
  iframe{width:390px;height:844px;border:0;background:#fff;box-shadow:0 12px 34px rgba(0,0,0,.22);flex:none}
  .side{font:12px/1.6 system-ui;color:#3d3542;max-width:460px}
  .side b{font-size:13px}
  #errline{white-space:pre-wrap;word-break:break-word;background:#fff;border-radius:8px;padding:8px}
</style>
</head>
<body>
<iframe id="phone" title="390 미리보기"></iframe>
<div class="side"><b>마음말 · 390×844</b><p id="errline">waiting…</p></div>
<script>
(async function () {
  var res = await fetch('./index.html?t=' + Date.now(), { cache: 'no-store' });
  var html = await res.text();
  var probe = '<script>window.__err=[];window.addEventListener("error",function(e){window.__err.push(String(e.message))});window.addEventListener("unhandledrejection",function(e){window.__err.push("rej:"+String(e.reason))});<\/script>';
  html = html.replace('<head>', '<head>' + probe);
  var f = document.getElementById('phone');
  function report() {
    try {
      var w = f.contentWindow;
      var e = w.__err || [];
      document.getElementById('errline').textContent =
        'errors: ' + (e.length ? e.join(' | ') : '0') +
        '\nwindow: ' + w.innerWidth + '×' + w.innerHeight +
        '\ntab: ' + (w.MMApp && w.MMApp.state ? w.MMApp.state.tab : '?');
      document.title = 'err:' + e.length;
    } catch (err) {
      document.getElementById('errline').textContent = 'probe fail: ' + err;
    }
  }
  f.addEventListener('load', function () { setTimeout(report, 700); });
  f.srcdoc = html;
  setInterval(report, 1200);
})();
</script>
</body>
</html>
